apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cadence
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mars9563/cadence.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: cadence
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
