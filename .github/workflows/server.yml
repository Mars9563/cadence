name: Server
on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mars9563/cadence-server

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cadence/server lint
      - run: pnpm --filter @cadence/server typecheck
  build-and-deploy:
    needs: check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{env.IMAGE}}:${{github.sha}}
            ${{env.IMAGE}}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Bump the image tag in k8s/server.yaml
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            sed -i -E "s#(image: ghcr\.io/mars9563/cadence-server:).*#\1${GITHUB_SHA}#" k8s/server.yaml
            git add k8s/server.yaml
            if git diff --cached --quiet; then
              echo "already at ${GITHUB_SHA}"; exit 0
            fi
            git commit --quiet -m "cd: deploy cadence-server @ ${GITHUB_SHA} [skip ci]"
            if git push origin HEAD:main; then
              echo "deployed cadence-server @ ${GITHUB_SHA}"; exit 0
            fi
            echo "push race on attempt ${attempt}; retrying"; sleep $(( (RANDOM % 4) + 1 ))
          done
          echo "could not push the bump after 5 attempts"; exit 1
